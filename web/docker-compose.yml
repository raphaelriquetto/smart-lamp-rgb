# Versão web do Smart Lamp, servida pela mesma VM do FIWARE.
#
#   cd smart-lamp-rgb/web
#   docker compose up -d        -> abre em http://IP-DA-VM:8080
#   docker compose down         -> para
#
# Os arquivos do site ficam em ./site (gerados por scripts/gerar-web.cmd no PC).
# O navegador chama o Orion direto na porta 1026 (o Orion do professor já libera CORS).

name: smart-lamp-web

services:
  web:
    image: nginx:stable-alpine
    container_name: smart-lamp-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
