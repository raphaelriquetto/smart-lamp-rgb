server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    # Arquivos com hash no nome (JS, fontes, imagens) podem ficar em cache por muito tempo
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 30d;
    }

    # A página em si nunca fica em cache: depois de atualizar o site, o celular já pega a versão nova
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
